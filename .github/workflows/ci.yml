name: CI

on:
  push:
  pull_request:

jobs:
  simulator-independent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check shell syntax
        run: bash -n ./*.sh scripts/*.sh
      - name: Check pinned installer plan
        run: ./install_isaaclab_stable.sh --dry-run
      - name: Check legacy Isaac Lab dependency build
        run: >-
          python -m pip wheel --no-deps --no-cache-dir --no-binary flatdict
          --build-constraint versions/build-constraints.txt
          --wheel-dir /tmp/kuavo-build-smoke flatdict==4.0.1
      - name: Verify no GitHub-size-limit files
        run: |
          find . -type f -not -path './.git/*' -size +99M -print -quit | tee /tmp/oversized.txt
          test ! -s /tmp/oversized.txt
