# 설계 초안: 실행용 config 아님. null은 조사/검증 후 확정한다.
draft: true
task: task1_box_pick
stage: pregrasp
num_envs: 1
box_types: [small, medium, large, xlarge]
# First validation target: the captured middle-shelf, eye-level medium box.
# This resolves to `MediumBox_0` in the packaged rack-box pose capture.
target_box_type: medium
target_box_id: MediumBox_0
target_rack_shelf: 2  # one-based: middle shelf in configs/rack_box_poses.json
scene_config: null
seed: 0
initial_state: task1_ready_bent  # precomputed q6/camera-aligned pose; no runtime bending phase
settle_steps: 120
grasp_candidates: []  # reference link/pose, approach axis/frame, 거리, hand 목표, 검증 상태
# Both wrists use the same physical bend with mirrored numerical signs.
wrist_pitch:
  enabled: true
  joint: q6
  preferred_bend_rad: 1.30899694  # 75 deg, physical stop in the desired direction
  maximum_relaxation_rad: 0.52359878  # at most 30 deg away from the preferred bend
  minimum_bend_rad: 0.78539816  # 45 deg
  left_bounds_rad: [-1.30899694, -0.78539816]
  right_bounds_rad: [0.78539816, 1.30899694]
  posture_weight: 0.60
  direct_gain: 2.0
initial_wrist_camera_alignment:
  validation_status: NOT_RUN
  camera_body_forward_axis: +X
  target_axis: robot_base_+X
  camera_body_up_axis: +Z
  target_up_axis: robot_base_+Z
randomization:
  enabled: false  # 최초 한 종류·한 위치 검증
  box_types: [small, medium, large, xlarge]
  rack_slot_ids: null
  box_position_offset_m:  # 각 축 [min, max]; 활성화 전 설정
    frame: null
    x: null
    y: null
    z: null
  box_yaw_offset_rad: null  # [min, max]; 회전축은 위 frame의 z
  lighting: {enabled: false, intensity_scale_range: null}
  friction: {enabled: false, coefficient_range: null}
success_thresholds:
  position_m: null
  rotation_rad: null
  hold_duration_s: null
  target_box_motion_m: null
timeout_s: null
