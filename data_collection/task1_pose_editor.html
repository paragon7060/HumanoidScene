<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kuavo Task1 Joint Pose Editor</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1017; color: #e8eef7; }
    header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #121a25; }
    header strong { margin-right: auto; }
    button, input { accent-color: #ffd44a; }
    button { border: 1px solid #445168; border-radius: 7px; padding: 7px 11px; color: #e8eef7; background: #202b3b; cursor: pointer; }
    button:hover { background: #2b3a50; }
    #connection { color: #ff8c8c; font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: calc(100vh - 52px); }
    #viewer { min-width: 0; display: grid; place-items: center; background: #05080d; overflow: hidden; }
    #frame { width: 100%; height: 100%; object-fit: contain; }
    aside { overflow: auto; padding: 12px; border-left: 1px solid #263246; background: #101722; }
    h2 { margin: 8px 0; font-size: 14px; color: #9fb0c8; text-transform: uppercase; letter-spacing: .08em; }
    .views, .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .views button.active { border-color: #ffd44a; color: #ffd44a; background: #2e3440; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 8px 0 14px; font-size: 13px; color: #c7d3e5; }
    .control { margin: 8px 0 14px; font-size: 13px; color: #c7d3e5; }
    .control-head { display: flex; justify-content: space-between; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
    .control input { width: 100%; }
    .joint { padding: 8px 0; border-top: 1px solid #273246; }
    .joint-head { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-size: 13px; }
    .joint input { width: 100%; }
    .left { color: #57d7ff; }
    .right { color: #ff62cb; }
    .selected { color: #ffd44a; font-weight: 700; }
    #metrics, #hint { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; color: #b9c6d8; }
    #hint { color: #8fa1b8; margin-top: 8px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #viewer { height: 52vh; } aside { border-left: 0; } }
  </style>
</head>
<body>
  <header>
    <strong>Task1 3인칭 관절 자세 편집기</strong>
    <span id="connection">연결 안 됨</span>
    <button id="connect">Connect</button>
  </header>
  <main>
    <section id="viewer"><img id="frame" alt="Isaac Sim third-person view"></section>
    <aside>
      <h2>3인칭 시점</h2>
      <div class="views">
        <button data-view="rear_left">후방 좌측</button><button data-view="rear_right">후방 우측</button>
        <button data-view="front_left">전방 좌측</button><button data-view="front_right">전방 우측</button>
        <button data-view="left">좌측</button><button data-view="right">우측</button>
        <button data-view="head">Head</button><button data-view="left_wrist">Left wrist</button>
        <button data-view="right_wrist">Right wrist</button>
      </div>
      <label class="toggle"><input id="grasp-visible" type="checkbox" checked> Grasp point 표시</label>
      <div class="control">
        <div class="control-head"><span>객체 로컬 Z 오프셋</span><span id="grasp-z-value">+0.000 m</span></div>
        <input id="grasp-z-offset" type="range" min="-0.15" max="0.15" step="0.005" value="0">
      </div>
      <h2>팔 관절</h2>
      <div id="joints">Connect 후 q1~q7 슬라이더가 표시됩니다.</div>
      <h2>자세</h2>
      <div class="actions"><button id="reset">초기 자세</button><button id="print">서버 로그에 출력</button><button id="copy">JSON 복사</button></div>
      <div id="metrics"></div>
      <div id="hint">청록=왼팔 축, 분홍=오른팔 축, 노랑=선택 관절. 초록=사용할 가로 grasp 쌍, 파랑=나머지 flap grasp 후보.</div>
    </aside>
  </main>
  <script>
    const PROTOCOL_VERSION = 2, HEADER_BYTES = 32;
    const frame = document.querySelector('#frame'), status = document.querySelector('#connection');
    const joints = document.querySelector('#joints'), metrics = document.querySelector('#metrics');
    const graspVisible = document.querySelector('#grasp-visible');
    const graspZOffset = document.querySelector('#grasp-z-offset');
    const graspZValue = document.querySelector('#grasp-z-value');
    let socket = null, sequence = 0, latestState = null, imageUrl = null;
    let activeJoint = null, jointRows = new Map();
    const pendingJointValues = new Map();
    function send(action, extra = {}) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({type:'pose_editor', protocol_version:PROTOCOL_VERSION, sequence:++sequence, action, ...extra}));
    }
    function connect() {
      socket?.close();
      const host = location.hostname || '127.0.0.1';
      socket = new WebSocket(`ws://${host}:8765`); socket.binaryType = 'arraybuffer';
      status.textContent = '연결 중…';
      socket.onopen = () => socket.send(JSON.stringify({type:'client_hello', protocol_version:PROTOCOL_VERSION}));
      socket.onclose = () => { status.textContent = '연결 끊김'; status.style.color = '#ff8c8c'; };
      socket.onerror = () => { status.textContent = '연결 오류'; };
      socket.onmessage = async event => {
        if (typeof event.data === 'string') {
          const value = JSON.parse(event.data);
          if (value.type === 'server_hello') { status.textContent = '연결됨'; status.style.color = '#77e89a'; }
          if (value.type === 'pose_editor_state') renderState(value);
          return;
        }
        const data = event.data instanceof Blob ? await event.data.arrayBuffer() : event.data;
        if (data.byteLength <= HEADER_BYTES) return;
        const next = URL.createObjectURL(new Blob([data.slice(HEADER_BYTES)], {type:'image/jpeg'}));
        frame.onload = () => { if (imageUrl) URL.revokeObjectURL(imageUrl); imageUrl = next; };
        frame.src = next;
      };
    }
    function buildJointRows(state) {
      joints.innerHTML = state.joints.map(j => {
        const side = j.name.includes('_l') ? 'left' : 'right';
        const label = j.name.match(/[lr](\d)_joint/)[1];
        return `<div class="joint ${side}" data-name="${j.name}" data-side="${side}">
          <div class="joint-head"><span>${side === 'left' ? 'L' : 'R'} q${label}</span><span class="joint-degrees">${j.degrees.toFixed(1)}°</span></div>
          <input type="range" min="${j.lower}" max="${j.upper}" step="0.005" value="${j.value}">
        </div>`;
      }).join('');
      jointRows = new Map(Array.from(joints.querySelectorAll('.joint'), row => [row.dataset.name, row]));
      for (const row of joints.querySelectorAll('.joint')) {
        const input = row.querySelector('input');
        input.onpointerdown = () => { activeJoint = row.dataset.name; };
        input.oninput = event => {
          const value = Number(event.target.value);
          pendingJointValues.set(row.dataset.name, {value, sentAt:performance.now()});
          row.querySelector('.joint-degrees').textContent = `${(value * 180 / Math.PI).toFixed(1)}°`;
          send('set_joint', {joint_name:row.dataset.name, value_rad:value});
        };
      }
    }
    function renderState(state) {
      latestState = state;
      if (jointRows.size !== state.joints.length || state.joints.some(j => !jointRows.has(j.name))) {
        buildJointRows(state);
      }
      const focus = state.selected_joint || '';
      graspVisible.checked = state.grasp_visible;
      if (document.activeElement !== graspZOffset) graspZOffset.value = state.grasp_z_offset_m;
      graspZValue.textContent = `${Number(graspZOffset.value) >= 0 ? '+' : ''}${Number(graspZOffset.value).toFixed(3)} m`;
      for (const button of document.querySelectorAll('[data-view]')) {
        button.classList.toggle('active', button.dataset.view === state.view);
      }
      for (const joint of state.joints) {
        const row = jointRows.get(joint.name), input = row.querySelector('input');
        const pending = pendingJointValues.get(joint.name);
        const acknowledged = pending && Math.abs(joint.value - pending.value) <= 0.003;
        if (acknowledged) pendingJointValues.delete(joint.name);
        const awaiting = pending && !acknowledged && performance.now() - pending.sentAt < 2000;
        const holdLocalValue = activeJoint === joint.name || awaiting;
        if (!holdLocalValue) input.value = joint.value;
        const displayedValue = holdLocalValue ? Number(input.value) : joint.value;
        row.className = `joint ${focus === joint.name ? 'selected' : row.dataset.side}`;
        row.querySelector('.joint-degrees').textContent = `${(displayedValue * 180 / Math.PI).toFixed(1)}°`;
      }
      const vec = value => value.map(v=>v.toFixed(3)).join(' ');
      metrics.textContent = `view: ${state.view}\ngrip object-Z offset: ${state.grasp_z_offset_m.toFixed(3)} m\nleft tool-down: ${state.tool_down_angle_deg[0].toFixed(1)}°\nright tool-down: ${state.tool_down_angle_deg[1].toFixed(1)}°\nTCP base xyz (m):\nL ${vec(state.tcp_position_b[0])}\nR ${vec(state.tcp_position_b[1])}\ngrasp base xyz (m):\nL ${vec(state.grasp_position_b[0])}\nR ${vec(state.grasp_position_b[1])}\ninward flap normal (base):\nL ${vec(state.inward_flap_normal_b[0])}\nR ${vec(state.inward_flap_normal_b[1])}\nshoulder → pregrasp (m): L ${state.shoulder_to_pregrasp_distance_m[0].toFixed(3)}  R ${state.shoulder_to_pregrasp_distance_m[1].toFixed(3)}\npregrasp above shoulder (m): L ${state.pregrasp_above_shoulder_m[0].toFixed(3)}  R ${state.pregrasp_above_shoulder_m[1].toFixed(3)}\ncleared: ${state.cleared_same_shelf_boxes.join(', ') || 'none'}`;
    }
    window.addEventListener('pointerup', () => { activeJoint = null; });
    window.addEventListener('pointercancel', () => { activeJoint = null; });
    document.querySelector('#connect').onclick = connect;
    for (const button of document.querySelectorAll('[data-view]')) button.onclick = () => send('set_view', {view:button.dataset.view});
    graspVisible.onchange = () => send('set_grasp_visibility', {visible:graspVisible.checked});
    graspZOffset.oninput = () => {
      const value = Number(graspZOffset.value);
      graspZValue.textContent = `${value >= 0 ? '+' : ''}${value.toFixed(3)} m`;
      send('set_grasp_z_offset', {offset_m:value});
    };
    document.querySelector('#reset').onclick = () => send('reset');
    document.querySelector('#print').onclick = () => send('print_pose');
    document.querySelector('#copy').onclick = async () => {
      if (!latestState) return;
      const pose = Object.fromEntries(latestState.joints.map(j => [j.name, j.value]));
      await navigator.clipboard.writeText(JSON.stringify(pose, null, 2));
    };
    connect();
  </script>
</body>
</html>
