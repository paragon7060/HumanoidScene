# 실제 실행 설정에서 조사한다. 다른 robot/hand로 임의 교체하지 않는다.
draft: true
robot_model: s200062  # 현재 checkout launcher 기본값; 물리 검증은 아직 미실행
hand_model: s200062_integrated
usd_path: null
urdf_path: null
base_link: base_link
left_tcp_link: zarm_l7_end_effector
right_tcp_link: zarm_r7_end_effector
# 기존 teleop의 링크 기준. URDF에서 wrist→end_effector -0.17m가 이미 적용됨.
# RL task의 추가 -0.12m offset을 여기에 자동 중복 적용하지 않는다.
left_tcp_offset_pose: [0, 0, 0, 1, 0, 0, 0]
right_tcp_offset_pose: [0, 0, 0, 1, 0, 0, 0]
tcp_validation_status: unverified
arm_joint_names: null
hand_joint_names: null
locked_joint_positions: null
planner_backend: curobo  # 설계 목표; 설치/API/양팔 지원 미검증
planner_version: null
physics_dt_s: 0.008333333333333333  # existing 120Hz physics
control_dt_s: 0.03333333333333333  # existing 30Hz control
planner_interpolation_dt_s: null
collision_margin_m: null
fk_position_tolerance_m: 0.002  # initial validation threshold, not calibrated physical TCP
fk_rotation_tolerance_rad: 0.01
