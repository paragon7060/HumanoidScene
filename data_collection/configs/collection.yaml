# 실행용이 아닌 설계 초안. null을 자동 기본값으로 소비하지 않는다.
draft: true
dataset_fps: 10
target_format: lerobot_v3
write_strategy: null  # direct / raw_then_convert: 기존 writer 검증 후 결정
save_hdf5: true
save_raw_control: true
episodes: 10  # first smoke target: ten successful episodes
max_attempts: 20  # retain failed attempts while collecting the ten successes
output_root: /home/work/mntvol/data/outputs
run_name: null  # output_root/<run_name>/; 기존 run 덮어쓰기 금지
resume: false
cameras:
  # Matches the existing Kuavo policy-camera contract: RGB CHW = [3, 480, 848].
  head: {feature: observation.images.head_cam_h, enabled: true, width: 848, height: 480}
  left_wrist: {feature: observation.images.wrist_cam_l, enabled: true, width: 848, height: 480}
  right_wrist: {feature: observation.images.wrist_cam_r, enabled: true, width: 848, height: 480}
video:
  dtype: video
  channels: 3
  fps: 10
  codec: av1
  pix_fmt: yuv420p
  has_audio: false
extra_modalities:
  depth: null
  segmentation: null
preserve_privileged_gt: true
record_failure_metadata: true
