  box_types: [small, medium, large, xlarge]
  rack_slot_ids: null
  box_position_offset_m:  # 각 축 [min, max]; 활성화 전 설정
    frame: null
    x: null
    y: null
    z: null
  box_yaw_offset_rad: null  # [min, max]; 회전축은 위 frame의 z
  lighting: {enabled: false, intensity_scale_range: null}
  friction: {enabled: false, coefficient_range: null}
success_thresholds:
  position_m: null
  rotation_rad: null
  hold_duration_s: null
  target_box_motion_m: null
