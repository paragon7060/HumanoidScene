# 설계 초안: 실행용 config 아님. null은 조사/검증 후 확정한다.
draft: true
task: task1_box_pick
stage: pregrasp
num_envs: 1
box_types: [small, medium, large, xlarge]
# First validation target: the captured middle-shelf, eye-level medium box.
# This resolves to `MediumBox_0` in the packaged rack-box pose capture.
target_box_type: medium
target_box_id: MediumBox_0
target_rack_shelf: 2  # one-based: middle shelf in configs/rack_box_poses.json
scene_config: null
seed: 0
initial_state: quest_ready_02  # existing captured preset; no asset/model substitution
settle_steps: 120
grasp_candidates: []  # reference link/pose, approach axis/frame, 거리, hand 목표, 검증 상태
# Both wrists use the same physical hand-pitch schedule.  The target
# orientation is mirrored per flap; only the pitch posture is shared.
wrist_pitch:
  enabled: true
  transit_fraction: 0.33  # enter the rack gap with roughly one-third pitch
  full_target_rad: 0.65  # Stage-3-like target, below the +/-0.698 rad stop
  posture_weight: 0.60  # IK null-space preference for zarm_*7_joint
  direct_q7_gain: 6.0  # bounded q7 velocity correction; no post-solve overwrite
  transit_orientation_weight: 0.0  # let position IK enter the narrow gap first
  prepare_steps: 30  # move from the captured ready pose to transit pitch
  rotate_steps: 90  # turn to full pitch while held at pregrasp
randomization:
  enabled: false  # 최초 한 종류·한 위치 검증
  box_types: [small, medium, large, xlarge]
  rack_slot_ids: null
  box_position_offset_m:  # 각 축 [min, max]; 활성화 전 설정
    frame: null
    x: null
    y: null
    z: null
  box_yaw_offset_rad: null  # [min, max]; 회전축은 위 frame의 z
  lighting: {enabled: false, intensity_scale_range: null}
  friction: {enabled: false, coefficient_range: null}
success_thresholds:
  position_m: null
  rotation_rad: null
  hold_duration_s: null
  target_box_motion_m: null
timeout_s: null
