[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuavo-isaaclab-scene"
version = "0.2.0"
description = "Kuavo S200062/S63 rack-to-conveyor workcell for Isaac Lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium==1.2.1",
  "h5py>=3.8",
  "numpy>=1.24,<2",
  "packaging>=23",
  "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
groot = ["lerobot[groot]"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kuavo_isaaclab_scene = [
  "configs/*.json",
  "assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
